<!DOCTYPE html>
<!-- PATTERN: HTML5 document structure - every page starts with this -->
<html lang="en">
<head>
    <!-- METADATA: Character encoding ensures proper text rendering (needed for special chars) -->
    <meta charset="UTF-8">
    <title>This is my title</title>
</head>
<body>
    <!-- KEY CONCEPT: Semantic hierarchy - hr marks thematic breaks, h1 is most important heading -->
    <hr>
    <h1>Hello <br> World!</h1>
    <br>
    <h1> h1 header
    </h1>
    <h2>h2 header</h2>
    <h3>h3 header</h3>
    <h4>h4 header</h4>
    <br>
    <h6>h6 header</h6>
    <h3>Handy HTML links:</h3>
    <hr size="3" noshade>
    <h2>https://developer.mozilla.org/en-US/docs/Web/HTML/Element/Heading_Elements</h2>

    <!-- This is how you comment in HTML -->

    <h2>https://www.w3schools.com/html/html_headings.asp</h2>
    <h2>https://devdocs.io/</h2>
    <hr>
    <!-- KEY CONCEPT: Text formatting - <em> and <strong> are semantic (better for accessibility/SEO) -->
    <!-- <i> and <b> are just presentation; prefer <em> and <strong> for meaning -->
    <p>
        <i>Italicized text</i>
        <br>
        <em>Emphasized text</em>
        <br>
        <b>Bolded text</b>
        <br>
        <strong>"Stronged" text</strong>
    </p>
</body>
</html>
